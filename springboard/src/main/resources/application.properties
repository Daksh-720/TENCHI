spring.application.name=springboard

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tenchi_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:your-fallback-key-must-be-at-least-32-chars}

# Admin Password for administrative actions (read from environment variable)
admin.password=${ADMIN_PASSWORD:}

# Multipart file upload configuration (allows large images, videos, and folders)
spring.servlet.multipart.max-file-size=4GB
spring.servlet.multipart.max-request-size=4GB

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

#  GitHub OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Frontend URL
app.frontend.url=${FRONTEND_URL:https://tenchi-data.vercel.app}

# Backblaze B2 Cloud Storage Configuration (read from environment variables)
b2.bucket.name=${B2_BUCKET_NAME:}
b2.endpoint=${B2_ENDPOINT:}
b2.region=${B2_REGION:}
b2.access.key=${B2_ACCESS_KEY:}
b2.secret.key=${B2_SECRET_KEY:}

# TiDB Cloud Serverless Keepalive & Hikari Pool Settings
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
