name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL || secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "::warning::BACKEND_HEALTH_URL secret is not set. Please add BACKEND_HEALTH_URL in repo Secrets."
            exit 0
          fi
          # Ensure /health endpoint is targeted if only base URL provided
          URL="$BACKEND_HEALTH_URL"
          if [[ "$URL" != *"/health" ]]; then
            URL="${URL%/}/health"
          fi
          response=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Health check status code: $response"
          if [ "$response" -eq 200 ]; then
            echo "Backend is awake and healthy!"
          else
            echo "Ping returned $response"
          fi
