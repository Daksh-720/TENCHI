name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://tenchi-backend.onrender.com/health)
          echo "Health check status code: $response"
          if [ "$response" -eq 200 ]; then
            echo "Render backend is awake and healthy!"
          else
            echo "Ping returned $response"
          fi
